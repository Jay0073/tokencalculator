name: Publish n8n TokenCalculator node

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish with provenance
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build core workspace
        run: npm run build:core

      - name: Test package
        run: npx vitest run tests/n8n-extract-input.test.ts tests/n8n-node-runtime.test.ts

      - name: Lint package
        run: npm run lint --workspace @jay0073/n8n-nodes-tokencalculator

      - name: Build package
        run: npm run build --workspace @jay0073/n8n-nodes-tokencalculator

      - name: Publish package with provenance
        env:
          RELEASE_MODE: "true"
        run: npx --yes npm@11.6.2 publish --workspace @jay0073/n8n-nodes-tokencalculator --access public --provenance

      - name: Verify published package with n8n scanner
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/n8n-nodes-tokencalculator/package.json').version")
          npx --yes @n8n/scan-community-package@beta "@jay0073/n8n-nodes-tokencalculator@$PACKAGE_VERSION"
